# Runs on Ember's own rootless Docker daemon: use ops/docker.sh compose -f ops/compose.local.yml ...
name: ember-local
services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: ember-postgres
    # The live app depends on it: start with ember-docker.service after a reboot.
    restart: unless-stopped
    env_file: ../server/.postgres.env
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - ember-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ember -d ember']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  ember-data:
    name: ember-data
