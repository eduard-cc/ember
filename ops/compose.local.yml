# Runs on Ember's own rootless Docker daemon: use ops/docker.sh compose -f ops/compose.local.yml ...
name: ember-local
services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: ember-postgres
    # The live app depends on it: start with ember-docker.service after a reboot.
    restart: unless-stopped
    env_file: ../apps/api/.postgres.env
    ports:
      # 55439 on the owner's development daemon; 55438 for the live database in the
      # service account's daemon (docs/operations.md).
      - '127.0.0.1:${EMBER_PG_PORT:-55439}:5432'
    volumes:
      - ember-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ember -d ember']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  ember-data:
    name: ember-data
