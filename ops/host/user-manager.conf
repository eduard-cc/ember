# Root-owned drop-in for user@<ember-uid>.service, installed from a reviewed checkout.
# The manager and every child inherit this namespace. User-unit directives alone cannot
# enforce a boundary: the account controls its user manager. Keep the account's own
# runtime directory, plus the boot marker and credential-checked systemd notify socket.
[Service]
TemporaryFileSystem=/run:ro
BindPaths=/run/user/%i
BindReadOnlyPaths=/run/systemd/system /run/systemd/notify /run/systemd/resolve/stub-resolv.conf /run/systemd/resolve/resolv.conf
# Logging sockets accept records with kernel-supplied credentials, not proxy requests.
BindReadOnlyPaths=/run/systemd/journal/stdout /run/systemd/journal/socket /run/systemd/journal/dev-log
PrivateTmp=yes
# Separate snap CUPS socket, and crontab's spool (scheduling outside this manager would
# escape its namespace). The account must have no pre-existing crontab at setup.
InaccessiblePaths=-/var/snap/cups/common/run /var/spool/cron
