version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Radix packages share internals (layers, focus scope); bump them together to keep one copy.
      radix:
        patterns:
          - '@radix-ui/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node types on the runtime major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react has no release that runs on ESLint 10; drop these once it has one.
      - dependency-name: 'eslint'
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      # typescript-eslint supports TypeScript below 6.1; drop this once it supports 7.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node types on the runtime major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript below 6.1; drop this once it supports 7.
      - dependency-name: 'typescript'
        versions: ['>=7']

  # The Dockerfile's Node base image, pinned by tag and digest. Checked daily and exempt from the
  # cooldown: a Node security release's flaws are public the day it ships, and the official image
  # carries far less supply-chain risk than an npm package, so waiting a week costs more than it buys.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - node
    ignore:
      # Keep the image on the runtime major in .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # The PostgreSQL image in ops/compose.local.yml. A new minor needs a backup and a container
  # recreate (docs/operations.md), so its PR carries the hold label and is never merged as is.
  # No cooldown: minors carry security fixes, and a person applies them anyway.
  - package-ecosystem: docker-compose
    directory: /ops
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - postgres
    labels:
      - dependencies
      - hold
    ignore:
      # Major upgrades need a dump and restore.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # Workflow actions are pinned by commit SHA with the version in a comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
