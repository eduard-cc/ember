name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A PR keeps only its newest run. Every push to main runs to completion: the deploy reads
# the push run of main's head commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are gated with `if:` on what a change touches, never with `on: paths:`: a skipped job
# counts as passing, while a workflow that never runs leaves the required check pending. `CI`
# is the only required check.
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # A PR compares its merge commit with the base branch (the merge commit's first parent).
      # A push to main compares with the newest main commit whose push run passed, so a
      # Markdown-only commit after a failed or cancelled code commit still runs every job. An
      # unknown base runs everything.
      - name: Detect code changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || base=''
          fi
          echo "base: ${base:-unknown}"
          if [[ -z $base ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null ||
            ! git merge-base --is-ancestor "$base" HEAD; then
            code=true
          else
            # Assigned first, so a failing diff stops the step instead of reading as no changes.
            files=$(git diff --name-only --no-renames "$base" HEAD)
            # Markdown needs only Lint & format; ops/lib.sh uses the same rule. An empty diff
            # runs everything.
            if grep -qv '\.md$' <<<"$files"; then code=true; else code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Prettier also checks Markdown, so this one runs for every change.
  lint-format:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - run: npm --prefix apps/web ci --include=dev && npm --prefix apps/api ci --include=dev
      # One Prettier run from apps/web checks the whole repository with each area's config.
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web run lint:check
      - run: npm --prefix apps/api run lint:check

  build:
    name: Build & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      - run: npm --prefix apps/web ci --include=dev && npm --prefix apps/api ci --include=dev
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/api run build
      # The web build typechecks apps/web first.
      - run: npm --prefix apps/web run build

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      # Some unit tests import API modules.
      - run: npm --prefix apps/web ci --include=dev && npm --prefix apps/api ci --include=dev
      - run: npm --prefix apps/web run test:run

  server-e2e:
    name: Server E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ember_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ember_dev
        ports:
          - '127.0.0.1:55439:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ember_ci -d ember_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTENV_CONFIG_PATH: /dev/null
      EMBER_HOST: 127.0.0.1
      EMBER_PORT: '5190'
      EMBER_ORIGIN: http://127.0.0.1:5188
      EMBER_SESSION_SECURE: 'false'
      EMBER_SESSION_TTL_SECONDS: '86400'
      EMBER_AUTH_MODE: password
      EMBER_DATABASE_URL: postgres://ember_dev:synthetic-ci-only@127.0.0.1:55439/ember_dev
      # Locally the backup scripts use Ember's own rootless Docker daemon; here the runner's.
      EMBER_DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      # The backup/restore regression test deliberately verifies this exact name,
      # image and loopback port. Do not weaken the host-side isolation checks.
      - name: Name the isolated test service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker rename "$POSTGRES_CONTAINER" ember-postgres
      # Tests connect as an unprivileged role, as in local development; only the
      # backup scripts use the service superuser through docker exec.
      - name: Create the unprivileged development role
        run: >-
          docker exec ember-postgres psql -U ember_ci -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE ember_dev LOGIN CREATEDB PASSWORD 'synthetic-ci-only'"
          -c "ALTER DATABASE ember_dev OWNER TO ember_dev"
      # The API date-contract tests also exercise the web app's shared schemas.
      - run: npm --prefix apps/web ci --include=dev && npm --prefix apps/api ci --include=dev
      # pretest:e2e builds the API first.
      - run: npm --prefix apps/api run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}

  playwright:
    name: Playwright (phone)
    runs-on: ubuntu-24.04
    # A slow apt mirror has added up to 5 minutes to install-deps.
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --include=dev
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # The HTML report embeds failure screenshots and retry traces. A timeout counts as
      # cancelled, not failed, so it uploads nothing.
      - name: Retain synthetic browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  pwa:
    name: PWA (Pixel 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --include=dev
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Production offline shell and safe updates
        run: npm run test:pwa
      - name: Retain synthetic browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pwa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/playwright-pwa-report/
          retention-days: 3
          if-no-files-found: ignore

  ops:
    name: Ops checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Synthetic install, notification and deploy decisions, with no live units or services.
      - run: shellcheck -x ops/host/setup-account.sh ops/host/setup-service-user.sh ops/install.sh ops/isolation-check.sh ops/notify.sh ops/test-install.sh ops/image-smoke.sh ops/ghcr-retention.sh
      - run: bash ops/test-install.sh
      - run: bash ops/test-auto-deploy.sh
      - run: bash ops/test-dependency-check.sh
      - run: python3 -B ops/test-ember-run.py

  # Builds the production image (the Dockerfile runs the build-time smoke check) and runs
  # ops/image-smoke.sh on it. Nothing here can push: the job never logs in to a registry. A
  # push to main hands the tested image to `Publish image` as a run artifact.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    outputs:
      id: ${{ steps.tested.outputs.id }}
    env:
      TAG: ember-image:${{ github.sha }}
      # ops/docker-host.sh uses Ember's own rootless daemon locally; here the runner's.
      EMBER_DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # The metadata output, build summary and build record would copy the event payload
        # (commit authors included) into the public log and a run artifact.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image
          # PRs only read the cache.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=image,mode=max' || '' }}
      - name: Runtime smoke test
        run: bash ops/image-smoke.sh "$TAG"
      - name: Record the tested image
        id: tested
        run: echo "id=$(docker image inspect --format '{{.Id}}' "$TAG")" | tee -a "$GITHUB_OUTPUT"
      - name: Save the tested image for publishing
        if: github.event_name == 'push'
        run: docker save --output "$RUNNER_TEMP/ember-image.tar" "$TAG"
      - name: Hand the tested image to Publish image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ember-image-tar
          path: ${{ runner.temp }}/ember-image.tar
          # Long enough to re-run only Publish image after a registry outage.
          retention-days: 3
          if-no-files-found: error

  # Main only, and the only job that can write packages. Pushes exactly the image `Image`
  # tested as `:sha-<commit>` and records its digest in the `ember-image` artifact, which
  # deploys read (a full re-run rebuilds and repoints the tag; each run's record pins its own). `:main` moves only after CI passed (release-image.yml).
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    env:
      TAG: ember-image:${{ github.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
      TESTED_ID: ${{ needs.image.outputs.id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ember-image-tar
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/ember-image.tar"
          id=$(docker image inspect --format '{{.Id}}' "$TAG")
          [[ -n $TESTED_ID && $id == "$TESTED_ID" ]] || { echo "loaded $id, tested ${TESTED_ID:-nothing}" >&2; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "$TAG" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:sha-$GITHUB_SHA" |
            grep -m1 "^$IMAGE@sha256:" | cut -d@ -f2)
          line="$IMAGE@$digest $GITHUB_SHA"
          LC_ALL=C grep -Eqx '^ghcr\.io/eduard-cc/ember@sha256:[0-9a-f]{64} [0-9a-f]{40}$' <<<"$line" ||
            { echo "unexpected image record: $line" >&2; exit 1; }
          echo "$line" >"$RUNNER_TEMP/ember-image"
          echo "Published \`$IMAGE@$digest\` for \`$GITHUB_SHA\`." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ember-image
          path: ${{ runner.temp }}/ember-image
          retention-days: 90
          if-no-files-found: error

  ci:
    # The only required check. Skipped jobs pass; a failed or cancelled one fails CI.
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, lint-format, build, unit, server-e2e, playwright, pwa, ops, image, publish]
    if: ${{ always() }}
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS" >/dev/null
