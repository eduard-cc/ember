name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Jobs are billed per started minute, so cheap checks share one job and setup.
jobs:
  checks:
    name: Format, lint, typecheck, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      # Root Prettier also reads server/.prettierrc for server files.
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm --prefix server run lint:check
      - run: npm --prefix server run typecheck
      # Synthetic install/notification and deploy decisions, with no live units or services.
      - run: shellcheck -x ops/host/setup-account.sh ops/host/setup-service-user.sh ops/install.sh ops/isolation-check.sh ops/notify.sh ops/test-install.sh
      - run: bash ops/test-install.sh && bash ops/test-auto-deploy.sh && bash ops/test-dependency-check.sh
      - run: python3 -B ops/test-ember-run.py
      - run: npm run test:run
      # The web build typechecks the root first. The server build runs in server-e2e.
      - run: npm run build

  server-e2e:
    name: Server build and E2E (disposable PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ember_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ember_dev
        ports:
          - '127.0.0.1:55439:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ember_ci -d ember_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTENV_CONFIG_PATH: /dev/null
      EMBER_HOST: 127.0.0.1
      EMBER_PORT: '5190'
      EMBER_ORIGIN: http://127.0.0.1:5188
      EMBER_SESSION_SECURE: 'false'
      EMBER_SESSION_TTL_SECONDS: '86400'
      EMBER_AUTH_MODE: password
      EMBER_DATABASE_URL: postgres://ember_dev:synthetic-ci-only@127.0.0.1:55439/ember_dev
      # Locally the backup scripts use Ember's own rootless Docker daemon; here the runner's.
      EMBER_DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # The backup/restore regression test deliberately verifies this exact name,
      # image and loopback port. Do not weaken the host-side isolation checks.
      - name: Name the isolated test service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker rename "$POSTGRES_CONTAINER" ember-postgres
      # Tests connect as an unprivileged role, as in local development; only the
      # backup scripts use the service superuser through docker exec.
      - name: Create the unprivileged development role
        run: >-
          docker exec ember-postgres psql -U ember_ci -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE ember_dev LOGIN CREATEDB PASSWORD 'synthetic-ci-only'"
          -c "ALTER DATABASE ember_dev OWNER TO ember_dev"
      # The server date-contract tests also exercise shared frontend schemas.
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      # pretest:e2e builds the server first.
      - run: npm --prefix server run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}

  playwright:
    name: Playwright (phone)
    runs-on: ubuntu-24.04
    # Phone E2E takes about 8 minutes and apt's install-deps up to 5 on a slow mirror; the
    # serial production PWA suite reuses setup. Leave headroom for both suites and caches.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Production offline shell and safe updates (Pixel 6)
        run: npm run test:pwa
      # Separate HTML reports embed failure screenshots and retry traces. Timeouts count as
      # cancelled, not failed, so they upload nothing.
      - name: Retain synthetic browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            playwright-pwa-report/
          retention-days: 3
          if-no-files-found: ignore
