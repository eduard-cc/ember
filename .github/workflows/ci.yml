name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A PR keeps only its newest run. Every push to main runs to completion: the deploy reads
# the push run of main's head commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are gated with `if:` on what a change touches, never with `on: paths:`: a skipped job
# counts as passing, while a workflow that never runs leaves the required check pending. `CI`
# is the only required check.
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # A PR compares its merge commit with the base branch (the merge commit's first parent).
      # A push to main compares with the newest main commit whose push run passed, so a
      # Markdown-only commit after a failed or cancelled code commit still runs every job. An
      # unknown base runs everything.
      - name: Detect code changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || base=''
          fi
          echo "base: ${base:-unknown}"
          if [[ -z $base ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null ||
            ! git merge-base --is-ancestor "$base" HEAD; then
            code=true
          else
            # Assigned first, so a failing diff stops the step instead of reading as no changes.
            files=$(git diff --name-only --no-renames "$base" HEAD)
            # Markdown needs only Lint & format; ops/lib.sh uses the same rule. An empty diff
            # runs everything.
            if grep -qv '\.md$' <<<"$files"; then code=true; else code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Prettier also checks Markdown, so this one runs for every change.
  lint-format:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      # Root Prettier also reads server/.prettierrc for server files.
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm --prefix server run lint:check

  build:
    name: Build & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      - run: npm --prefix server run typecheck
      - run: npm --prefix server run build
      # The web build typechecks the root first.
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # Some unit tests import server modules.
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      - run: npm run test:run

  server-e2e:
    name: Server E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ember_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ember_dev
        ports:
          - '127.0.0.1:55439:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ember_ci -d ember_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTENV_CONFIG_PATH: /dev/null
      EMBER_HOST: 127.0.0.1
      EMBER_PORT: '5190'
      EMBER_ORIGIN: http://127.0.0.1:5188
      EMBER_SESSION_SECURE: 'false'
      EMBER_SESSION_TTL_SECONDS: '86400'
      EMBER_AUTH_MODE: password
      EMBER_DATABASE_URL: postgres://ember_dev:synthetic-ci-only@127.0.0.1:55439/ember_dev
      # Locally the backup scripts use Ember's own rootless Docker daemon; here the runner's.
      EMBER_DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # The backup/restore regression test deliberately verifies this exact name,
      # image and loopback port. Do not weaken the host-side isolation checks.
      - name: Name the isolated test service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker rename "$POSTGRES_CONTAINER" ember-postgres
      # Tests connect as an unprivileged role, as in local development; only the
      # backup scripts use the service superuser through docker exec.
      - name: Create the unprivileged development role
        run: >-
          docker exec ember-postgres psql -U ember_ci -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE ember_dev LOGIN CREATEDB PASSWORD 'synthetic-ci-only'"
          -c "ALTER DATABASE ember_dev OWNER TO ember_dev"
      # The server date-contract tests also exercise shared frontend schemas.
      - run: npm ci --include=dev && npm --prefix server ci --include=dev
      # pretest:e2e builds the server first.
      - run: npm --prefix server run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}

  playwright:
    name: Playwright (phone)
    runs-on: ubuntu-24.04
    # A slow apt mirror has added up to 5 minutes to install-deps.
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # The HTML report embeds failure screenshots and retry traces. A timeout counts as
      # cancelled, not failed, so it uploads nothing.
      - name: Retain synthetic browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  pwa:
    name: PWA (Pixel 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Production offline shell and safe updates
        run: npm run test:pwa
      - name: Retain synthetic browser diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pwa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-pwa-report/
          retention-days: 3
          if-no-files-found: ignore

  ops:
    name: Ops checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Synthetic install, notification and deploy decisions, with no live units or services.
      - run: shellcheck -x ops/host/setup-account.sh ops/host/setup-service-user.sh ops/install.sh ops/isolation-check.sh ops/notify.sh ops/test-install.sh
      - run: bash ops/test-install.sh
      - run: bash ops/test-auto-deploy.sh
      - run: bash ops/test-dependency-check.sh
      - run: python3 -B ops/test-ember-run.py

  ci:
    # The only required check. Skipped jobs pass; a failed or cancelled one fails CI.
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, lint-format, build, unit, server-e2e, playwright, pwa, ops]
    if: ${{ always() }}
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS" >/dev/null
